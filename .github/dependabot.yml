# Dependabot: wöchentliche Update-PRs für die Python-Abhängigkeiten.
# Sicherheits-Alerts und automatische Security-Fixes sind zusätzlich
# direkt in den Repo-Einstellungen aktiviert.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      python-minor-und-patch:
        update-types:
          - minor
          - patch
