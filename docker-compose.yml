services:
  sportabo:
    build: .
    container_name: sportabo
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      # No insecure fallbacks: compose fails fast if these are unset (.env)
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - APP_ENV=${APP_ENV:-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - BASE_URL=${BASE_URL:-https://${DOMAIN}}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: sportabo-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env (e.g. sportabo.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - sportabo

volumes:
  caddy_data:
  caddy_config:
